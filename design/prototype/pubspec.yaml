name: apolune_proto
description: "Apolune — retro poster design prototype"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/grain.png
  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/oswald.ttf
    - family: Golos
      fonts:
        - asset: assets/fonts/golos.ttf
    - family: Mono
      fonts:
        - asset: assets/fonts/mono.ttf
